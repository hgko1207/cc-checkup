# 설치 파일 만들기: v로 시작하는 태그(예: v0.2.0)를 올리거나 Actions 화면에서 직접 실행한다.
# 결과는 실행 화면의 Artifacts에서 받는다 (자동 배포하지 않음 — 사내 배포 경로에 TF가 올린다).
#
# 코드 서명 (저장소 Settings → Secrets에 넣으면 자동으로 서명, 없으면 서명 없이 만든다)
#   Windows: CSC_LINK(.pfx를 base64로), CSC_KEY_PASSWORD
#   macOS:   MAC_CSC_LINK(.p12를 base64로), MAC_CSC_KEY_PASSWORD,
#            공증 APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run dist:win -- --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run dist:mac -- --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # 인증서가 없으면 키체인에서 찾지 않고 서명 없이 만든다
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CSC_LINK != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            release/*.dmg
            release/*.zip
