# 설치 파일 만들기: v로 시작하는 태그(예: v0.2.0)를 올리거나 Actions 화면에서 직접 실행한다.
# 태그로 실행하면 Windows·macOS 설치 파일을 GitHub 릴리스 "초안"에 붙인다. 내용을 확인한 뒤 사람이 공개한다.
# 릴리스 설명은 docs/release-notes/<태그>.md (없으면 자동 생성 설명).
# 수동 실행은 Artifacts에만 남긴다.
#
# 코드 서명 (저장소 Settings → Secrets에 넣으면 자동으로 서명, 없으면 서명 없이 만든다)
#   Windows: CSC_LINK(.pfx를 base64로), CSC_KEY_PASSWORD
#   macOS:   MAC_CSC_LINK(.p12를 base64로), MAC_CSC_KEY_PASSWORD,
#            공증 APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run dist:win -- --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run dist:mac -- --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # 인증서가 없으면 키체인에서 찾지 않고 서명 없이 만든다
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CSC_LINK != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            release/*.dmg
            release/*.zip

  draft-release:
    # 태그로 실행했을 때만: 두 설치 파일을 모아 릴리스 초안을 만들거나 기존 초안에 다시 올린다
    # macOS 빌드가 실패해도 Windows 설치 파일이 있으면 초안을 만든다 (macOS는 아직 실제 맥에서 확인 전)
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist-installers
          merge-multiple: true
      - name: 릴리스 초안에 설치 파일 올리기
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist-installers
          NOTES="docs/release-notes/${TAG}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-installers/* --clobber
          elif [ -f "$NOTES" ]; then
            gh release create "$TAG" dist-installers/* --draft --title "Claude 세팅 점검 $TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" dist-installers/* --draft --title "Claude 세팅 점검 $TAG" --generate-notes
          fi
